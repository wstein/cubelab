<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Top Face Gradient (Cyan to Indigo) -->
    <linearGradient id="top-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Left Face Gradient (Deep Indigo to Violet) -->
    <linearGradient id="left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- 'C' Monogram Gradient (Vibrant Magenta to Electric Violet) -->
    <linearGradient id="c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Cube Assembly with subtle glow -->
  <g filter="url(#glow)" transform="translate(32, 33)">
    <!-- Top Face (3x3 Isometric Diamond Grid) -->
    <!-- Center top vertex is (0, -20), left is (-16, -11), right is (16, -11), bottom is (0, -2) -->
    <!-- Row 0 -->
    <polygon points="0,-20 -5.33,-17 0,-14 5.33,-17" fill="url(#top-grad)"/>
    <polygon points="-5.33,-17 -10.67,-14 -5.33,-11 0,-14" fill="url(#top-grad)"/>
    <polygon points="-10.67,-14 -16,-11 -10.67,-8 -5.33,-11" fill="url(#top-grad)"/>
    <!-- Row 1 -->
    <polygon points="5.33,-17 0,-14 5.33,-11 10.67,-14" fill="url(#top-grad)"/>
    <polygon points="0,-14 -5.33,-11 0,-8 5.33,-11" fill="url(#top-grad)"/>
    <polygon points="-5.33,-11 -10.67,-8 -5.33,-5 0,-8" fill="url(#top-grad)"/>
    <!-- Row 2 -->
    <polygon points="10.67,-14 5.33,-11 10.67,-8 16,-11" fill="url(#top-grad)"/>
    <polygon points="5.33,-11 0,-8 5.33,-5 10.67,-8" fill="url(#top-grad)"/>
    <polygon points="0,-8 -5.33,-5 0,-2 5.33,-5" fill="url(#top-grad)"/>

    <!-- Left Face Tiles (3x3 Vertical Isometric) -->
    <!-- Col 0 (leftmost) -->
    <polygon points="-16,-10 -11.5,-7.5 -11.5,-2 -16,-4.5" fill="#4338ca"/>
    <polygon points="-16,-3.5 -11.5,-1 -11.5,4.5 -16,2" fill="#3730a3"/>
    <polygon points="-16,3 -11.5,5.5 -11.5,11 -16,8.5" fill="#312e81"/>
    <!-- Col 1 (middle) -->
    <polygon points="-10.5,-7 -6,-4.5 -6,1 -10.5,-1.5" fill="#4f46e5"/>
    <polygon points="-10.5,-0.5 -6,2 -6,7.5 -10.5,5" fill="#4338ca"/>
    <polygon points="-10.5,6 -6,8.5 -6,14 -10.5,11.5" fill="#3730a3"/>
    <!-- Col 2 (near spine) -->
    <polygon points="-5,-4 -0.5,-1.5 -0.5,4 -5,1.5" fill="#6366f1"/>
    <polygon points="-5,2.5 -0.5,5 -0.5,10.5 -5,8" fill="#4f46e5"/>
    <polygon points="-5,9 -0.5,11.5 -0.5,17 -5,14.5" fill="#4338ca"/>

    <!-- Right Face: Stylized 'C' Monogram Wrapping Around Isometric Facet -->
    <!-- Top arm, vertical spine/arc, and bottom arm forming an unmistakable bold 'C' -->
    <path d="M 0.5,-1.5
             L 15.5,-10
             L 15.5,-4
             L 6.5,1
             L 6.5,8
             L 15.5,3
             L 15.5,9
             L 0.5,17.5
             Z"
          fill="url(#c-grad)"
          stroke="#0b0f19"
          stroke-width="0.8"
          stroke-linejoin="round"/>

    <!-- Inner 'C' Cutout / Accent to give 3D depth and dynamic curve -->
    <path d="M 6.5,1.5
             C 4.5,3 4,7 6.5,8
             L 14,4
             L 14,1.5
             Z"
          fill="#0f172a"
          opacity="0.4"/>
  </g>
</svg>
