<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Top Face: Pearlescent Crisp White -->
    <linearGradient id="top-white" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Top Face: UR Accent Tile (Glowing Electric Emerald) -->
    <linearGradient id="top-green-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <!-- Left Face: Vibrant Emerald Green -->
    <linearGradient id="left-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Left Face: FR Accent Tile (Electric Sapphire Blue) -->
    <linearGradient id="left-blue-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Right Face: Vivid Radiant Ruby Red -->
    <linearGradient id="right-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Subtle ambient depth filter -->
    <filter id="cube-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#cube-shadow)" stroke="#090d16" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Face (3x3 Isometric Tiles) -->
    <!-- Row 0 (far top) -->
    <polygon points="32,2.5 39.5,6.8 32,11.2 24.5,6.8" fill="url(#top-white)"/>
    <polygon points="24.5,6.8 32,11.2 24.5,15.5 17,11.2" fill="url(#top-white)"/>
    <polygon points="17,11.2 24.5,15.5 17,19.8 9.5,15.5" fill="url(#top-white)"/>
    <!-- Row 1 (middle) -->
    <polygon points="39.5,6.8 47,11.2 39.5,15.5 32,11.2" fill="url(#top-white)"/>
    <polygon points="32,11.2 39.5,15.5 32,19.8 24.5,15.5" fill="url(#top-white)"/>
    <polygon points="24.5,15.5 32,19.8 24.5,24.2 17,19.8" fill="url(#top-white)"/>
    <!-- Row 2 (front of top face) -->
    <polygon points="47,11.2 54.5,15.5 47,19.8 39.5,15.5" fill="url(#top-white)"/>
    <!-- UR Edge: THE GREEN ACCENT STICKER -->
    <polygon points="39.5,15.5 47,19.8 39.5,24.2 32,19.8" fill="url(#top-green-accent)"/>
    <!-- UFR Corner: white -->
    <polygon points="32,19.8 39.5,24.2 32,28.5 24.5,24.2" fill="url(#top-white)"/>

    <!-- Left Face (Front, Green) -->
    <!-- Col 0 (left edge) -->
    <polygon points="9.5,16.5 17,20.8 17,29.5 9.5,25.2" fill="url(#left-green)"/>
    <polygon points="9.5,26.2 17,30.5 17,39.2 9.5,34.8" fill="url(#left-green)"/>
    <polygon points="9.5,35.8 17,40.2 17,48.8 9.5,44.5" fill="url(#left-green)"/>
    <!-- Col 1 (center) -->
    <polygon points="17,20.8 24.5,25.2 24.5,33.8 17,29.5" fill="url(#left-green)"/>
    <polygon points="17,30.5 24.5,34.8 24.5,43.5 17,39.2" fill="url(#left-green)"/>
    <polygon points="17,40.2 24.5,44.5 24.5,53.2 17,48.8" fill="url(#left-green)"/>
    <!-- Col 2 (spine) -->
    <polygon points="24.5,25.2 32,29.5 32,38.2 24.5,33.8" fill="url(#left-green)"/>
    <!-- FR Edge: THE BLUE ACCENT STICKER -->
    <polygon points="24.5,34.8 32,39.2 32,47.8 24.5,43.5" fill="url(#left-blue-accent)"/>
    <!-- DFR Corner: green -->
    <polygon points="24.5,44.5 32,48.8 32,57.5 24.5,53.2" fill="url(#left-green)"/>

    <!-- Right Face (Red) -->
    <!-- Col 0 (spine) -->
    <polygon points="32,29.5 39.5,25.2 39.5,33.8 32,38.2" fill="url(#right-red)"/>
    <polygon points="32,39.2 39.5,34.8 39.5,43.5 32,47.8" fill="url(#right-red)"/>
    <polygon points="32,48.8 39.5,44.5 39.5,53.2 32,57.5" fill="url(#right-red)"/>
    <!-- Col 1 (center) -->
    <polygon points="39.5,25.2 47,20.8 47,29.5 39.5,33.8" fill="url(#right-red)"/>
    <polygon points="39.5,34.8 47,30.5 47,39.2 39.5,43.5" fill="url(#right-red)"/>
    <polygon points="39.5,44.5 47,40.2 47,48.8 39.5,53.2" fill="url(#right-red)"/>
    <!-- Col 2 (right edge) -->
    <polygon points="47,20.8 54.5,16.5 54.5,25.2 47,29.5" fill="url(#right-red)"/>
    <polygon points="47,30.5 54.5,26.2 54.5,34.8 47,39.2" fill="url(#right-red)"/>
    <polygon points="47,40.2 54.5,35.8 54.5,44.5 47,48.8" fill="url(#right-red)"/>
  </g>
</svg>
