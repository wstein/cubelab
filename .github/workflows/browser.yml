name: Browser tests

# Playwright browser tests run on pull requests only with the `e2e` label.
# They live in their own workflow so that adding a label starts only this
# workflow: `ci.yml` does not listen for `labeled` and its `test-and-build`
# run is never cancelled by a label event. The workflow starts on any label;
# the job runs only when that label is `e2e` (or, for other events, when the
# PR carries `e2e`). Other label events get their own concurrency group, so
# they neither rerun nor cancel a browser run already in progress.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'e2e' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  browser:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e')
    # ubuntu-latest now resolves to Ubuntu 26.04, which breaks Playwright 1.56.1's
    # `playwright install --with-deps`; keep the image pinned to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # playwright.config.mjs starts the preview server with bunx.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # astro.config.mjs serves below /cubelab whenever GITHUB_ACTIONS is set;
      # the browser tests expect the site at the root, as in local runs.
      - name: Run browser tests
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: env -u GITHUB_ACTIONS npm run test:browser -- --reporter=github,line,html
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
