name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build

  # Playwright browser tests run on pull requests only with the `e2e` label.
  browser:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    # ubuntu-latest now resolves to Ubuntu 26.04; pin the image on which
    # `playwright install --with-deps` is known to work.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # playwright.config.mjs starts the preview server with bunx.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # astro.config.mjs serves below /cubelab whenever GITHUB_ACTIONS is set;
      # the browser tests expect the site at the root, as in local runs.
      - name: Run browser tests
        run: env -u GITHUB_ACTIONS npm run test:browser -- --reporter=github,line
