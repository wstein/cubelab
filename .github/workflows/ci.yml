name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # playwright.config.mjs starts the preview server with bunx.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose preview server
        continue-on-error: true
        env:
          GITHUB_ACTIONS: "false"
        run: |
          npm run build > /tmp/build.log 2>&1; echo "::warning::build exit $? $(tail -n 3 /tmp/build.log | tr '\n' '|')"
          (bunx astro preview --host 127.0.0.1 --port 4390 > /tmp/preview.log 2>&1 &) ; sleep 20
          echo "::warning::preview log $(head -c 700 /tmp/preview.log | tr '\n' '|')"
          echo "::warning::curl $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4390/ 2>&1) bun $(bun --version 2>&1)"
      # astro.config.mjs serves below /cubelab when GITHUB_ACTIONS is true,
      # but the browser tests expect the site at the root, as in local runs.
      - name: Run browser tests
        env:
          GITHUB_ACTIONS: "false"
        run: npm run test:browser -- --reporter=github,line
